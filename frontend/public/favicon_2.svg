<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep background atmosphere glow -->
    <filter id="bg-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Vivid laser neon glow effect -->
    <filter id="neon-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Matrix Green Gradient -->
    <linearGradient id="matrix-green" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#004411" />
      <stop offset="60%" stop-color="#00ff66" />
      <stop offset="100%" stop-color="#55ffaa" />
    </linearGradient>

    <!-- Cyber Cyan Gradient -->
    <linearGradient id="cyber-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" />
      <stop offset="70%" stop-color="#0077ff" />
      <stop offset="100%" stop-color="#001144" />
    </linearGradient>
  </defs>

  <!-- Dark Theme Canvas Background -->
  <rect width="512" height="512" fill="#090d16" rx="96" />

  <!-- Matrix Background Digital Streams -->
  <g opacity="0.1" stroke="#00ff66" stroke-width="2" stroke-linecap="round">
    <line x1="120" y1="280" x2="120" y2="440" stroke-dasharray="4 16 24 10" stroke-width="3" />
    <line x1="150" y1="320" x2="150" y2="420" stroke-dasharray="12 8 4 16" stroke-width="3" />
    <line x1="362" y1="280" x2="362" y2="440" stroke-dasharray="20 6 12 18" stroke-width="3" />
    <line x1="392" y1="300" x2="392" y2="410" stroke-dasharray="8 12 16 6" stroke-width="3" />
  </g>

  <!-- Single Folder Outline Body -->
  <g filter="url(#neon-glow)">
    <!-- Back tab and main outline -->
    <path d="M 140,140 L 220,140 L 255,175 L 400,175 C 416,175 420,179 420,195 L 420,310 C 420,326 416,330 400,330 L 140,330 C 124,330 120,326 120,310 L 120,160 C 120,144 124,140 140,140 Z" 
          fill="#090d16" fill-opacity="0.8" stroke="url(#cyber-cyan)" stroke-width="6" stroke-linejoin="round" />
  </g>

  <!-- Vertical Column of Three Checkboxes -->
  <g filter="url(#neon-glow)" fill="none" stroke="#00ffff" stroke-width="4" stroke-linejoin="round">
    <!-- Box 1 (Top Box, intersections occur here) -->
    <rect x="236" y="225" width="40" height="40" rx="6" />
    <!-- Box 2 (Middle Box) -->
    <rect x="236" y="295" width="40" height="40" rx="6" />
    <!-- Box 3 (Bottom Box) -->
    <rect x="236" y="365" width="40" height="40" rx="6" />
  </g>

  <!-- Mini ticks pre-set inside the lower two boxes for progressive tracker style -->
  <g filter="url(#neon-glow)" fill="none" stroke="#00ff66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
    <path d="M 246,315 L 254,323 L 268,307" />
    <path d="M 246,385 L 254,393 L 268,377" />
  </g>

  <!-- The Master Hero Tick passing through the entire stack -->
  <g filter="url(#neon-glow)">
    <!-- Volumetric Ambient Light Shadow for the Tick -->
    <path d="M 160,250 L 250,340 L 440,100" fill="none" stroke="#00ff66" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity="0.2" />
    <!-- Sharp Core Laser Energy Line -->
    <path d="M 160,250 L 250,340 L 440,100" fill="none" stroke="url(#matrix-green)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Glowing Crosshair Node Points on Tips -->
    <circle cx="160" cy="250" r="4" fill="#ffffff" />
    <circle cx="250" cy="340" r="5" fill="#ffffff" />
    <circle cx="440" cy="100" r="4" fill="#ffffff" />
  </g>

  <!-- Circuit Node Intersection Details -->
  <g fill="#00ffaa">
    <circle cx="120" cy="235" r="4" />
    <circle cx="420" cy="250" r="4" />
  </g>
</svg>